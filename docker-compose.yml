version: '3.8'

services:
  # 1. php
  php:
    build: ./docker/php
    container_name: php_app
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  # 2. nginx
  nginx:
    build: ./docker/nginx
    container_name: nginx_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # 3. postgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
